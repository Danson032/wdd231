<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Join Nairobi Chamber of Commerce</title>

  <meta name="author" content="Danson Nganga">
  <meta name="description" content="Apply to become a member of the Nairobi Chamber of Commerce.">

  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/small.css">
  <link rel="stylesheet" href="styles/large.css">

  <script src="scripts/join.js" defer></script>
</head>

<body>

  <header>
    <h1>Nairobi Chamber of Commerce</h1>
    <button id="ham-btn" class="hamburger"><span id="ham-label">Menu</span></button>
  </header>

  <nav id="nav" class="navigation">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="discover.html">Discover</a></li>
      <li><a href="directory.html">Directory</a></li>
      <li class="current"><a href="join.html">Join</a></li>
    </ul>
  </nav>

  <main class="join-layout">

    <form method="get" action="thankyou.html">

      <label for="fname">First Name</label>
      <input id="fname" type="text" name="fname" required autocomplete="given-name">

      <label for="lname">Last Name</label>
      <input id="lname" type="text" name="lname" required autocomplete="family-name">

      <label for="orgtitle">Organization Title</label>
      <input id="orgtitle" type="text" name="orgtitle" autocomplete="organization-title" pattern="[A-Za-z\-\s]{7,}"
        title="Minimum 7 characters">

      <label for="email">Email</label>
      <input id="email" type="email" name="email" required autocomplete="email" placeholder="example@email.com">

      <label for="phone">Mobile Phone</label>
      <input id="phone" type="tel" name="phone" required autocomplete="tel">

      <label for="business">Business Name</label>
      <input id="business" type="text" name="business" required autocomplete="organization">

      <label for="membership">Membership Level</label>
      <label for="membership">Membership Level</label>
      <select id="membership" name="membership" required>
        <option value="" disabled selected>Select a membership level</option>
        <option value="np">NP Membership</option>
        <option value="bronze">Bronze Membership</option>
        <option value="silver">Silver Membership</option>
        <option value="gold">Gold Membership</option>
      </select>

      <label for="description">Business Description</label>
      <textarea id="description" name="description"></textarea>

      <input type="hidden" id="timestamp" name="timestamp">

      <input type="submit" value="Apply for Membership">

    </form>

    <section class="cards">
      <div class="card">
        <h2>NP Membership</h2>
        <button type="button" onclick="openModal('npModal')">View Benefits</button>
      </div>

      <div class="card">
        <h2>Bronze Membership</h2>
        <button type="button" onclick="openModal('bronzeModal')">View Benefits</button>
      </div>

      <div class="card">
        <h2>Silver Membership</h2>
        <button type="button" onclick="openModal('silverModal')">View Benefits</button>
      </div>

      <div class="card">
        <h2>Gold Membership</h2>
        <button type="button" onclick="openModal('goldModal')">View Benefits</button>
      </div>
    </section>

  </main>

  <dialog id="npModal">
    <p>Free for nonprofits. Basic listing.</p><button onclick="closeModal('npModal')">Close</button>
  </dialog>
  <dialog id="bronzeModal">
    <p>Includes events.</p><button onclick="closeModal('bronzeModal')">Close</button>
  </dialog>
  <dialog id="silverModal">
    <p>Includes training + ads.</p><button onclick="closeModal('silverModal')">Close</button>
  </dialog>
  <dialog id="goldModal">
    <p>All premium benefits.</p><button onclick="closeModal('goldModal')">Close</button>
  </dialog>

  <footer>
    <p id="lastModified"></p>
    <p id="copyright"></p>
  </footer>

</body>

</html>
